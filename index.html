<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tericsoft DevOps Internship Task</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #172033; }
    main { width: min(680px, calc(100% - 40px)); box-sizing: border-box; padding: 40px; background: white; border: 1px solid #dfe6f0; border-radius: 18px; box-shadow: 0 18px 55px rgba(25, 45, 80, .08); }
    .tag { display: inline-block; padding: 6px 10px; border-radius: 999px; background: #e8f7ee; color: #17683a; font-size: .85rem; font-weight: 700; }
    h1 { margin: 18px 0 10px; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.04em; }
    p { color: #526078; line-height: 1.65; }
    ul { padding-left: 20px; color: #34415a; line-height: 1.9; }
    code { background: #eef2f8; padding: 3px 6px; border-radius: 5px; }
    footer { border-top: 1px solid #e8edf4; margin-top: 24px; padding-top: 16px; font-size: .9rem; color: #69758a; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Deployment successful</span>
    <h1>Hello from Docker on AWS!</h1>
    <p>This sample web application is served by Nginx inside a Docker container on an AWS EC2 instance.</p>
    <ul>
      <li>Application: static HTML</li>
      <li>Container runtime: Docker</li>
      <li>Application port: <code>8081</code></li>
    </ul>
    <footer>Tericsoft Technologies — DevOps Internship Task</footer>
  </main>
</body>
</html>
